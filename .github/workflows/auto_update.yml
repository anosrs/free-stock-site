name: Auto Update Stock Site

on:
  schedule:
    - cron: '*/5 * * * *'   # 5分間隔自動巡回
  workflow_dispatch:        # 手動実行ボタン

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Auto Builder
        env:
          AMAZON_TAG: 'nekonoki-22'
          SITE_URL: 'https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}'
          DISCORD_WEBHOOK_URL: 'https://discord.com/api/webhooks/1531328595799183491/PFvqwM1s23KBhz8aEZuXLVPwW6fdL8NvnPbYW7utQhpqpGkdqcnEJ3nHOwOy2n_XbglP'
        run: |
          python auto_builder.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git status
          git diff-index --quiet HEAD || (git commit -m "Auto update site data and HTML [skip ci]" && git push)
